<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore Móvil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>

    <header class="encabezado">
        <div class="encabezado-top">
            <h1 class="logo">TechStore <span class="logo-acento">Móvil</span></h1>

            <div class="encabezado-acciones">
                <button id="btn-favoritos-header" class="btn-icono" type="button" aria-label="Ver mis favoritos">
                    <span aria-hidden="true">♥</span>
                    <span id="badge-favoritos-contador" class="badge">0</span>
                </button>
                <button id="btn-tema" class="btn-icono" type="button" aria-label="Cambiar tema claro u oscuro">
                    <span id="icono-tema" aria-hidden="true">🌙</span>
                </button>
            </div>
        </div>

        <div class="buscador-wrapper">
            <span class="buscador-icono" aria-hidden="true">🔍</span>
            <input
                id="input-buscador"
                class="buscador-input"
                type="search"
                placeholder="Buscar celulares, notebooks, accesorios…"
                autocomplete="off"
            />
        </div>

        <nav class="filtros" aria-label="Filtrar catálogo por categoría">
            <button class="btn-filtro activo" type="button" data-categoria="todos">Todos</button>
            <button class="btn-filtro" type="button" data-categoria="smartphones">Smartphones</button>
            <button class="btn-filtro" type="button" data-categoria="laptops">Laptops</button>
            <button class="btn-filtro" type="button" data-categoria="mobile-accessories">Accesorios</button>
            <button class="btn-filtro" type="button" data-categoria="favoritos">⭐ Mis favoritos</button>
        </nav>
    </header>

    <main class="contenido">
        <p id="metricas-catalogo" class="metricas" aria-live="polite"></p>

        <div id="estado-loading" class="estado">
            <div class="spinner" aria-hidden="true"></div>
            <p>Cargando catálogo desde la nube…</p>
        </div>

        <div id="estado-error" class="estado" hidden>
            <p class="estado-error-titulo">No pudimos cargar el catálogo</p>
            <p class="estado-error-texto">Revisá tu conexión a internet e intentá de nuevo.</p>
            <button id="btn-reintentar" class="btn-reintentar" type="button">Reintentar</button>
        </div>

        <section id="contenedor-catalogo" class="catalogo" hidden aria-label="Catálogo de productos"></section>

        <p id="sin-resultados" class="sin-resultados" hidden>
            No encontramos productos con ese criterio de búsqueda.
        </p>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
